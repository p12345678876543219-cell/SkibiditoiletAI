name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Compile Dylib for iOS (arm64)
      run: |
        xcrun -sdk iphoneos clang -arch arm64 -fobjc-arc -dynamiclib main.mm -o skibiditoiletAI.dylib -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics -lc++

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: skibiditoiletAI-dylib
        path: skibiditoiletAI.dylib
